<script>
const N=6,KEY=[4,0,2,3,1,5],LT="ABCDEF";
const TK=[
{t:"mc",h:"Task 1: Choose the correct word",i:"Read each definition and choose the correct option (A, B, C, or D).",q:[

{t:"fill",h:"Task 2: Past Simple or Past Continuous",i:"Put the verbs in brackets into the Past Simple or Past Continuous.",q:[

["My sister ___ (iron) the clothes when the phone ___ (ring).",[["was ironing"],["rang"]]],

["What ___ you ___ (do) at 7 p.m. yesterday?",[["were"],["doing"]]]]},
{t:"fill",h:"Task 3: Tag questions",i:"Complete the tag questions.",q:[

["They were cleaning the kitchen at 6 p.m., ___?",[["weren't they","were they not"]]],
["Jane didn't wash up after dinner, ___?",[["did she"]]],
["Dad was washing the car at 5 p.m., ___?",[["wasn't he","was he not"]]],
["We didn't do the shopping last Sunday, ___?",[["did we"]]],
["The children weren't playing in the garden when it started to rain, ___?",[["were they"]]]]},
{t:"mc",h:"Task 4: Wh-questions",i:"Choose the correct question for each answer.",q:[
["— I washed the dishes yesterday.",["What do you did yesterday?","What did you do yesterday?","Where did you wash the dishes yesterday?","What you did yesterday?"],1],
["— She was cleaning her room when I came home.",["What did she doing when you came home?","What she was doing when you came home?","What was she doing when you came home?","What was she do when you came home?"],2],
["— They went shopping on Saturday.",["Where did they go shopping?","When did they went shopping?","When they went shopping?","When did they go shopping?"],3],
["— My dad cooked dinner last night.",["Who cooked dinner last night?","Who cook dinner last night?","Who did cooked dinner last night?","Why did your dad cook dinner last night?"],0],
["— Ann cleaned her room because it was very dirty.",["Why Ann cleaned her room?","Why did Ann clean her room?","Why did Ann cleaned her room?","When did Ann clean her room?"],1],
["— Tom was sweeping the floor in the kitchen.",["Where Tom was sweeping the floor?","When was Tom sweeping the floor?","Where was Tom sweeping the floor?","Where did Tom sweeping the floor?"],2]]},
{t:"ord",h:"Task 5: Put the dialogue in the correct order",i:"Put the dialogue in the correct order.",L:[
"I was helping Mum in the kitchen yesterday. I wanted to make a cake, but I forgot to add sugar. It didn’t taste good at all!",
"Then she laughed and said it’s okay, because everyone makes mistakes. We decided to bake another one together. It was much better this time.",
"Really? Did your mum get angry when she tried it?",
"No, she didn’t. She was surprised at first, but then she said I was very responsible to cook by myself.",
"What were you doing yesterday afternoon, Tom?",
"That’s great! It’s nice when your parents support you, even when something goes wrong."]}];
const NT=TK.length;
const $=id=>document.getElementById(id),app=$("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const K=e=>"chores7diag:"+e,ld=e=>{try{return JSON.parse(localStorage.getItem(K(e)))}catch(_){return null}};
const sv=()=>{try{localStorage.setItem(K(S.e),JSON.stringify(S))}catch(_){}};
let S=null;
const nz=s=>String(s||"").toLowerCase().replace(/[’‘`´]/g,"'").replace(/[?.!,;:]/g,"").replace(/\s+/g," ").trim();
const ex=s=>{const m=s.match(/\[([^\]]*)\]|\(([^)]*)\)/);if(!m)return[s];const a=s.slice(0,m.index),b=s.slice(m.index+m[0].length),o=m[1]!=null?[m[1],""]:m[2].split("|");return o.flatMap(x=>ex(a+x+b))};
TK.forEach(T=>{if(T.t==="wh")T.q.forEach(q=>{q[2]=[...new Set(q[2].flatMap(ex).map(nz))]})});
const cm=s=>nz(s).replace(/(\w)n't\b/g,"$1 not");
const done=(t,i)=>{const T=TK[t],a=S.a[t][i];if(T.t==="mc")return a!=null;if(T.t==="fill")return Array.isArray(a)&&a.length===T.q[i][1].length&&a.every(x=>nz(x));if(T.t==="wh")return !!nz(a);return false};
const cnt=t=>TK[t].t==="ord"?S.a[t].length:TK[t].q.filter((_,i)=>done(t,i)).length;
function ok(t,i){const T=TK[t],a=S.a[t][i];
 if(T.t==="mc")return a===T.q[i][2];
 if(T.t==="fill")return Array.isArray(a)&&T.q[i][1].every((acc,b)=>acc.map(cm).includes(cm(a[b])));
 if(T.t==="wh")return T.q[i][2].includes(nz(a));
 return S.a[t][i]===KEY[i]}
const pts=t=>Math.round([...Array(N).keys()].filter(i=>ok(t,i)).length*11/N);
function info(t,i){const T=TK[t],a=S.a[t][i];
 if(T.t==="mc"){const q=T.q[i];return[q[0],a==null?"(no answer)":q[1][a],q[1][q[2]]]}
 if(T.t==="fill"){const q=T.q[i];return[q[0].replace(/___/g,"____"),Array.isArray(a)&&a.some(x=>nz(x))?a.map(x=>nz(x)?x.trim():"-").join(" / "):"(no answer)",q[1].map(x=>x[0]).join(" / ")]}
 if(T.t==="wh"){const q=T.q[i];return["— "+q[0],nz(a)?a.trim():"(no answer)",q[1]]}
 return["Position "+(i+1),a==null?"(no answer)":LT[a],LT[KEY[i]]]}
function mq(q,i,a){return`<div class=q><p class=qt><b class=nm>${i+1}</b> ${esc(q[0])}</p>`+q[1].map((o,j)=>`<button class="o${a===j?" s":""}" data-a=o data-i=${i} data-j=${j}><b class=lt>${"ABCD"[j]}</b><span>${esc(o)}</span></button>`).join("")+"</div>"}
const inp=(i,b,v,m)=>`<input class="inl" type=text data-i=${i} data-b=${b} ${m?"data-m=w ":""}value="${esc(v||"")}" autocomplete=off autocapitalize=off autocorrect=off spellcheck=false>`;
function fl(q,i,a){const p=q[0].split("___");let h=`<div class=q><p class=sen><b class=nm>${i+1}</b> `;p.forEach((s,b)=>{h+=esc(s);if(b<p.length-1)h+=inp(i,b,Array.isArray(a)?a[b]:"")});return h+"</p></div>"}
function wq(q,i,a){return`<div class=q><p class=sen><b class=nm>${i+1}</b> Write the question:</p><input type=text data-i=${i} data-m=w value="${esc(a||"")}" autocomplete=off autocapitalize=sentences autocorrect=off spellcheck=false placeholder="..."><p class=ans>— ${esc(q[0])}</p></div>`}
function oq(T,a){let h=`<div class=q><p class=st>Your order<small>Натискайте на репліки по черзі: перша репліка діалогу — перша. Щоб прибрати репліку, натисніть на неї ще раз.</small></p><div class=slots>`;
 for(let k=0;k<N;k++)h+=`<span class="sl${a[k]!=null?" f":""}">${k+1}. ${a[k]!=null?LT[a[k]]:"–"}</span>`;
 h+=`</div>`;T.L.forEach((l,j)=>{const p=a.indexOf(j);h+=`<button class="o${p>=0?" s":""}" data-a=p data-j=${j}><b class=lt>${LT[j]}</b><span>${esc(l)}</span>${p>=0?`<span class=pos>${p+1}</span>`:""}</button>`});
 return h+`<button class=rs data-a=rs>Скинути порядок</button></div>`}
const UK=["Прочитайте кожне речення й оберіть правильний варіант (A, B, C або D).","Впишіть дієслова з дужок у Past Simple або Past Continuous.","Допишіть розділові питання (tag questions).","Для кожної відповіді оберіть правильне питання (A, B, C або D).","Розташуйте репліки діалогу в правильному порядку."];
function sbh(t,n){return`<button class=pb data-a=nx ${n<N?"disabled":""}>${t<NT-1?"Далі":"Отримати результати"}</button>${n<N?`<p class=hint>Дайте відповідь на всі питання, щоб продовжити (залишилось: ${N-n}).</p>`:""}`}
function upd(){const t=S.t,n=cnt(t),c=$("cn"),s=$("sb");if(c)c.textContent="Виконано: "+n+"/"+N;if(s)s.innerHTML=sbh(t,n)}
function draw(){
 if(!S){app.innerHTML=`<div class=hero><div class=em><i>🧹</i><i>🧺</i><i>🍽️</i><i>🧽</i></div><h1>Вітаємо!</h1></div><p>Сьогодні ви проходитимете діагностувальну роботу з англійської мови на тему «Do your chores».</p><div class=card><b>Коротка інструкція</b><ul><li>Тест можна пройти лише 1 раз. Реєстрація на тест за електронною адресою.</li><li>Тест містить 5 завдань, у кожному завданні 6 питань.</li><li>Кожне завдання оцінюється в 11 балів.</li><li>Підсумкова оцінка — це середня оцінка з усіх 5 завдань.</li><li>Якщо не вдалося зберегти PDF, поверніться на цю сторінку й увійдіть з тією самою електронною адресою — результат буде збережено.</li></ul></div><label for=nm><b>Ім’я та прізвище</b> <small class=mu>(англійською мовою)</small></label><input id=nm type=text autocomplete=off autocapitalize=words placeholder="Ivan Petrenko" style="margin:6px 0 14px"><label for=em><b>Ваша електронна адреса</b></label><input id=em type=email inputmode=email autocomplete=off placeholder="name@example.com"><p class=err id=er></p><button class=pb data-a=go>Почати тест</button>`;return}
 if(S.done)return res();
 const t=S.t,T=TK[t],n=cnt(t),a=S.a[t];
 app.innerHTML=`<div class=bar><span>Завдання ${t+1} з ${NT}</span><span id=cn>Виконано: ${n}/${N}</span></div><div class=dots>${TK.map((_,k)=>`<i class="${k<t?"dn":k===t?"cu":""}"></i>`).join("")}</div><div class=card><h2>${T.h}</h2><p class=ins>${T.i}</p><p class=hint>${UK[t]}</p></div>`+(T.t==="ord"?oq(T,a):T.q.map((q,i)=>T.t==="mc"?mq(q,i,a[i]):T.t==="fill"?fl(q,i,a[i]):wq(q,i,a[i])).join(""))+`<div class=sb id=sb>${sbh(t,n)}</div>`}
function res(){const P=TK.map((_,t)=>pts(t)),tot=Math.round(P.reduce((a,b)=>a+b,0)/NT);
 let h=`<h2>Ваш результат</h2><p class=mu>${esc(S.n||"")}</p><div class=card>`+P.map((p,t)=>`<div class=row><span>Завдання ${t+1}</span><b>${p} / 11</b><u class=rb><i style="width:${p/11*100}%"></i></u></div>`).join("")+`<div class=tot>Загальна оцінка<strong>${tot} / 11</strong></div><div class=sm>`;
 TK.forEach((T,t)=>{h+=`<h4>${T.h}</h4><ul>`+[...Array(N).keys()].map(i=>{const[s,u,c]=info(t,i),g=ok(t,i);return`<li><span class=${g?"y":"x"}>${g?"✓":"✗"}</span> ${i+1}. ${esc(s)}<br>Ваша відповідь: ${esc(u)}${g?"":`<br>Правильна відповідь: <span class=y>${esc(c)}</span>`}</li>`}).join("")+"</ul>"});
 app.innerHTML=h+`</div></div><button class=pb data-a=pdf>Відправити результат вчителю у Class</button><p class=mu id=msg>Натисніть кнопку, збережіть PDF і прикріпіть його до завдання в Google Classroom.</p>`}
const msg=s=>{const m=$("msg");if(m)m.textContent=s};
async function pdf(){const J=window.jspdf&&window.jspdf.jsPDF;if(!J)return msg("Не вдалося завантажити модуль PDF. Перевірте інтернет і спробуйте ще раз.");
 const d=new J({unit:"mm",format:"a4"});let y=15;const A=s=>String(s).replace(/[’‘]/g,"'").replace(/[“”]/g,'"');
 const L=(s,z=10,b)=>{d.setFont("helvetica",b?"bold":"normal");d.setFontSize(z);d.splitTextToSize(A(s),180).forEach(l=>{if(y>282){d.addPage();y=15}d.text(l,15,y);y+=z*.5+1.5})};
 const P=TK.map((_,t)=>pts(t)),tot=Math.round(P.reduce((a,b)=>a+b,0)/NT);
 L("Diagnostic Test: Do your chores (Grade 7)",16,1);L("Student: "+(S.n||"-"));L("Student email: "+S.e);L("Date: "+new Date().toISOString().slice(0,10));y+=3;
 L("Total grade: "+tot+" / 11",14,1);P.forEach((p,t)=>L("Task "+(t+1)+": "+p+" / 11"));
 TK.forEach((T,t)=>{y+=4;L(T.h,11,1);for(let i=0;i<N;i++){const[s,u,c]=info(t,i),g=ok(t,i);L((g?"[OK] ":"[X] ")+(i+1)+". "+s,9);L("   Answer: "+u+(g?"":"   |   Correct: "+c),9)}});
 const fn="chores-test-"+S.e.split("@")[0].replace(/[^a-z0-9]/gi,"_")+".pdf";let dl=null;
